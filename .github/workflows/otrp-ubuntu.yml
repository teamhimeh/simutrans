name: OTRP build Ubuntu

on:
  push:
    tags:
      - v*
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu 24.04 / SDL2 (distribution)
            os: ubuntu-24.04
            backend: sdl2
            sdl_package: libsdl2-dev
            distribute: true
          - name: Ubuntu 26.04 / SDL3
            os: ubuntu-26.04
            backend: sdl3
            sdl_package: libsdl3-dev
            distribute: false
    
    steps:
    - uses: actions/checkout@v4

    - name: install_dependencies
      run: |
        sudo apt-get -y update 
        sudo apt-get -ym install ${{ matrix.sdl_package }}
        sudo apt-get -ym install libfreetype6-dev
        sudo apt-get -ym install libminiupnpc-dev
        sudo apt-get -ym install libbz2-dev
        sudo apt-get -ym install pkg-config
        sudo apt-get -ym install autoconf
        
    - name: install zstd 1.4.4
      run: |
        cd $HOME
        wget https://github.com/facebook/zstd/releases/download/v1.4.4/zstd-1.4.4.tar.gz
        tar -zxvf zstd-1.4.4.tar.gz
        cd zstd-1.4.4
        make -j
        sudo make install
        cd $GITHUB_WORKSPACE
        
    - name: setup
      run: |
        autoconf 
        ./configure
        echo "BACKEND = ${{ matrix.backend }}" >>config.default
        echo "FLAGS = -DREVISION=$(svn info --show-item revision svn://servers.simutrans.org/simutrans) " >>config.default
        echo "STATIC = 1" >>config.default
        cat config.default >>/dev/stderr
        
    - name: make
      run: |
        make -j

    - name: Set suffix for file naming
      if: matrix.distribute
      run: |
        if [[ $GITHUB_REF == refs/tags/* ]]; then
          echo "SUFFIX=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV
        else
          echo "SUFFIX=" >> $GITHUB_ENV
        fi

    - name: Rename executable
      if: matrix.distribute
      run: |
        if [ -n "${{ env.SUFFIX }}" ]; then
          mv sim sim-linux-OTRP${{ env.SUFFIX }}
        else
          mv sim sim-linux-OTRP
        fi

    - name: Upload the executable
      if: matrix.distribute
      uses: actions/upload-artifact@v4
      with:
        name: sim-linux-OTRP${{ env.SUFFIX }}
        path: ./sim-linux-OTRP${{ env.SUFFIX }}
