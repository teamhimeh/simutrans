# A workflow_run is read from the default branch, not the tagged commit.
# Never execute a tag's workflow or build scripts in the signing job.
name: OTRP notarize macOS tag

on:
  workflow_run:
    workflows: [OTRP build MacOS]
    types: [completed]

permissions:
  contents: read

jobs:
  authorize:
    if: >-
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      (github.event.workflow_run.path == '.github/workflows/otrp-macos.yml' ||
       startsWith(github.event.workflow_run.path, '.github/workflows/otrp-macos.yml@')) &&
      startsWith(github.event.workflow_run.head_branch, 'v')
    runs-on: ubuntu-latest
    outputs:
      eligible: ${{ steps.check.outputs.eligible }}
      sha: ${{ steps.check.outputs.sha }}
      tag: ${{ steps.check.outputs.tag }}
    steps:
    - name: Checkout trusted workflow and history
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        ref: ${{ github.sha }}
        fetch-depth: 0
        persist-credentials: false

    - name: Check tag and branch history
      id: check
      env:
        TAG: ${{ github.event.workflow_run.head_branch }}
        SHA: ${{ github.event.workflow_run.head_sha }}
      run: |
        set -euo pipefail
        .github/macos/check-tag.sh "$TAG" "$SHA" >> "$GITHUB_OUTPUT"
        echo "sha=$SHA" >> "$GITHUB_OUTPUT"
        echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  build:
    needs: authorize
    if: needs.authorize.outputs.eligible == 'true'
    runs-on: macos-15
    steps:
    - name: Checkout tagged source
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        ref: ${{ needs.authorize.outputs.sha }}
        path: source
        persist-credentials: false

    - name: Checkout trusted packaging scripts
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        ref: ${{ github.sha }}
        path: ci
        sparse-checkout: .github
        sparse-checkout-cone-mode: false
        persist-credentials: false

    - name: Install dependencies
      run: brew install sdl3 freetype libpng zstd miniupnpc pkg-config

    - name: Build tagged source without signing credentials
      working-directory: source
      run: sh ./.github/build-mac.sh

    - name: Package and inspect app
      working-directory: source
      env:
        TAG: ${{ needs.authorize.outputs.tag }}
      run: |
        set -euo pipefail
        app="sim-mac-OTRP${TAG}.app"
        bash ../ci/.github/package-mac-app.sh --binary build/default/sim --app "$app"
        ../ci/.github/macos/inspect-bundle.sh "$app" arm64
        ditto -c -k --keepParent "$app" "$RUNNER_TEMP/unsigned.zip"

    - name: Upload signing payload
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: macos-tag-unsigned-payload
        path: ${{ runner.temp }}/unsigned.zip
        if-no-files-found: error
        retention-days: 7

  sign:
    needs: [authorize, build]
    runs-on: macos-15
    environment: macos-signing
    timeout-minutes: 60
    concurrency:
      group: otrp-macos-signing
      cancel-in-progress: false
    env:
      TAG: ${{ needs.authorize.outputs.tag }}
    steps:
    - name: Checkout trusted signing scripts
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        ref: ${{ github.sha }}
        sparse-checkout: .github/macos
        sparse-checkout-cone-mode: false
        persist-credentials: false

    - name: Download build payload
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: macos-tag-unsigned-payload
        path: incoming

    - name: Check payload before loading the identity
      run: |
        set -euo pipefail
        mkdir work
        ditto -x -k incoming/unsigned.zip work
        .github/macos/check-payload.sh work "sim-mac-OTRP${TAG}.app"

    - name: Check signing configuration
      env:
        MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
        MACOS_CERTIFICATE_P12_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_P12_PASSWORD }}
        MACOS_NOTARY_API_KEY_P8: ${{ secrets.MACOS_NOTARY_API_KEY_P8 }}
        MACOS_NOTARY_API_KEY_ID: ${{ secrets.MACOS_NOTARY_API_KEY_ID }}
        MACOS_NOTARY_API_ISSUER_ID: ${{ secrets.MACOS_NOTARY_API_ISSUER_ID }}
        MACOS_SIGNING_IDENTITY: ${{ vars.MACOS_SIGNING_IDENTITY }}
        MACOS_TEAM_ID: ${{ vars.MACOS_TEAM_ID }}
      run: |
        set -euo pipefail
        for name in MACOS_CERTIFICATE_P12 MACOS_CERTIFICATE_P12_PASSWORD \
          MACOS_NOTARY_API_KEY_P8 MACOS_NOTARY_API_KEY_ID MACOS_NOTARY_API_ISSUER_ID \
          MACOS_SIGNING_IDENTITY MACOS_TEAM_ID; do
          if [ -z "${!name:-}" ]; then
            echo "::error::Required signing setting $name is missing from the macos-signing environment."
            exit 1
          fi
        done

    - name: Create temporary keychain
      env:
        MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
        MACOS_CERTIFICATE_P12_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_P12_PASSWORD }}
        MACOS_SIGNING_IDENTITY: ${{ vars.MACOS_SIGNING_IDENTITY }}
      run: .github/macos/keychain.sh setup

    - name: Sign
      env:
        MACOS_SIGNING_IDENTITY: ${{ vars.MACOS_SIGNING_IDENTITY }}
        MACOS_TEAM_ID: ${{ vars.MACOS_TEAM_ID }}
      run: .github/macos/sign.sh "work/sim-mac-OTRP${TAG}.app"

    - name: Create submission archive
      run: ditto -c -k --keepParent "work/sim-mac-OTRP${TAG}.app" "$RUNNER_TEMP/notarize.zip"

    - name: Notarize and staple
      env:
        MACOS_NOTARY_API_KEY_P8: ${{ secrets.MACOS_NOTARY_API_KEY_P8 }}
        MACOS_NOTARY_API_KEY_ID: ${{ secrets.MACOS_NOTARY_API_KEY_ID }}
        MACOS_NOTARY_API_ISSUER_ID: ${{ secrets.MACOS_NOTARY_API_ISSUER_ID }}
      run: .github/macos/notarize.sh "$RUNNER_TEMP/notarize.zip" "work/sim-mac-OTRP${TAG}.app"

    - name: Create and verify distribution archive
      run: |
        set -euo pipefail
        app="work/sim-mac-OTRP${TAG}.app"
        symlinks=$(find "$app" -type l | wc -l | tr -d ' ')
        mkdir dist
        ditto -c -k --keepParent "$app" "dist/sim-mac-OTRP${TAG}.zip"
        .github/macos/verify.sh "dist/sim-mac-OTRP${TAG}.zip" arm64 "$symlinks"

    - name: Upload notarized app
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: sim-mac-OTRP${{ needs.authorize.outputs.tag }}.app
        path: dist/*.zip
        if-no-files-found: error

    - name: Destroy temporary keychain
      if: always()
      run: |
        if [ -x .github/macos/keychain.sh ]; then
          .github/macos/keychain.sh teardown
        fi
